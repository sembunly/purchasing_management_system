services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: purchasing_oracle_db
    restart: unless-stopped
    ports:
      - "1522:1521"
    environment:
      ORACLE_PWD: "0000"
    volumes:
      - purchasing_oracle_data:/opt/oracle/oradata

  spring-app:
    build: .
    container_name: purchasing_spring_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: purchasing_user
      SPRING_DATASOURCE_PASSWORD: "0000"
    depends_on:
      - oracle-db

volumes:
  purchasing_oracle_data:
