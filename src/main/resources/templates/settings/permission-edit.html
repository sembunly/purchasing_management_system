<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edit user group | PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content">
  <header class="topbar"><button class="btn icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button><span class="ms-auto small text-secondary" sec:authentication="name">admin</span><form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Sign out</button></form></header>
  <main class="page">
    <div class="page-head"><div><a class="btn btn-sm btn-outline-secondary mb-3" th:href="@{/settings/permissions}"><i class="bi bi-arrow-left me-1"></i>Back to groups</a><h1 th:text="|Edit ${selectedRole.name} group|">Edit ADMIN group</h1><p class="text-secondary mb-0">Assign users and choose the actions this group can perform.</p></div></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <th:block th:with="canEdit=${@permissionService.hasPermission(#authentication,'PERMISSIONS','EDIT') and @permissionService.hasPermission(#authentication,'USERS','EDIT')}">
    <form id="groupForm" th:action="@{/settings/permissions/edit/{id}(id=${selectedRole.id})}" method="post">
      <section class="panel form-panel mb-4"><div class="panel-head"><h2>Group information</h2></div><label class="form-label fw-semibold" for="groupName">Name</label><input id="groupName" class="form-control" type="text" th:value="${selectedRole.name}" readonly aria-describedby="groupNameHelp"><div id="groupNameHelp" class="form-text">Groups use the existing Oracle roles.</div></section>
      <section class="panel form-panel mb-4"><div class="panel-head"><h2>Members</h2></div>
        <div class="member-transfer">
          <div><label class="form-label fw-semibold" for="availableUsers">Available users</label><select id="availableUsers" class="form-select" multiple size="9"><option th:each="user : ${activeUsers}" th:unless="${memberIds.contains(user.id)}" th:value="${user.id}" th:text="${user.fullName + ' (' + user.username + ')'}">User</option></select></div>
          <div class="member-actions" th:if="${canEdit}"><button type="button" class="btn btn-outline-primary" data-transfer="add" aria-label="Add selected users"><i class="bi bi-arrow-right"></i></button><button type="button" class="btn btn-outline-secondary" data-transfer="remove" aria-label="Remove selected users"><i class="bi bi-arrow-left"></i></button></div>
          <div><label class="form-label fw-semibold" for="groupMembers">Member of group</label><select id="groupMembers" class="form-select" multiple size="9"><option th:each="user : ${activeUsers}" th:if="${memberIds.contains(user.id)}" th:value="${user.id}" th:text="${user.fullName + ' (' + user.username + ')'}">User</option></select></div>
        </div><div id="memberIds"></div>
      </section>
      <section class="panel form-panel"><div class="panel-head"><h2>Permissions</h2><button type="button" class="btn btn-sm btn-light" data-expand-all>Collapse all</button></div>
        <label class="permission-action permission-all fw-semibold"><span>All rights</span><input class="form-check-input" type="checkbox" data-all-rights th:disabled="${!canEdit}"></label>
        <div class="permission-tree" th:each="type : ${moduleTypes}"><details open><summary><i class="bi bi-folder2-open me-2"></i><span th:text="${type.name}">Module type</span></summary>
          <label class="permission-action permission-type-rights fw-semibold"><span>Full rights for <span th:text="${type.name}">type</span></span><input class="form-check-input" type="checkbox" data-type-rights th:disabled="${!canEdit}"></label>
          <div class="permission-modules" th:each="module : ${modules}" th:if="${module.moduleType.id == type.id}"><details open><summary><i class="bi bi-grid me-2"></i><span th:text="${module.name}">Module</span></summary><div class="permission-actions">
            <label class="permission-action fw-semibold"><span>Full rights</span><input class="form-check-input" type="checkbox" data-module-rights th:disabled="${!canEdit}"></label>
            <label class="permission-action" th:each="action : ${actions}"><span th:text="${module.name + ' (' + action + ')'}">Module (VIEW)</span><input class="form-check-input" type="checkbox" name="allowed" th:value="|${module.id}:${action}|" th:checked="${allowedKeys.contains(module.id + ':' + action)}" th:disabled="${!canEdit}"></label>
          </div></details></div>
        </details></div>
      </section>
      <div class="d-flex gap-2 mt-4"><button th:if="${canEdit}" type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save group</button><a class="btn btn-outline-secondary" th:href="@{/settings/permissions}">Back</a></div>
    </form></th:block>
  </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/settings-permissions.js}"></script>
</body></html>
