<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Purchasing Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app"><div class="shell">
  <aside th:replace="~{layouts/navigation :: sidebar}" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"><div class="sidebar-brand"><span class="brand-mark">PM</span> Purchasing</div>
    <nav class="side-nav">
      <a th:if="${@permissionService.hasPermission(#authentication,'DASHBOARD','VIEW')}" th:href="@{/dashboard}"><i class="bi bi-grid-1x2"></i>Dashboard</a>
      <div class="side-group" th:if="${@permissionService.hasPermission(#authentication,'USERS','VIEW') or @permissionService.hasPermission(#authentication,'PERMISSIONS','VIEW')}">Settings</div>
      <a class="active" th:if="${@permissionService.hasPermission(#authentication,'USERS','VIEW')}" th:href="@{/settings/users}"><i class="bi bi-people"></i>Users</a>
      <a th:if="${@permissionService.hasPermission(#authentication,'PERMISSIONS','VIEW')}" th:href="@{/settings/permissions}"><i class="bi bi-shield-check"></i>Permissions</a>
    </nav>
  </aside>
  <div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button>
    <span class="ms-auto small text-secondary" sec:authentication="name">admin</span><form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Sign out</button></form></header>
    <main class="page"><div class="page-head"><div><h1>Users</h1><p class="text-secondary mb-0">Manage system access and user roles.</p></div>
      <a th:if="${@permissionService.hasPermission(#authentication,'USERS','CREATE')}" class="btn btn-primary" th:href="@{/settings/users/new}"><i class="bi bi-person-plus me-1"></i>New user</a></div>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <section class="panel"><form class="row g-2 mb-4" method="get"><div class="col-sm-7 col-md-5"><input class="form-control" name="search" th:value="${search}" placeholder="Search username or full name"></div><div class="col-auto"><button class="btn btn-outline-secondary">Search</button></div></form>
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>User</th><th>Email</th><th>Roles</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody>
          <tr th:each="user : ${users.content}"><td><b th:text="${user.fullName}">Name</b><small class="d-block text-secondary" th:text="${user.username}">username</small></td><td th:text="${user.email ?: '-'}">email</td>
            <td><span class="badge text-bg-light me-1" th:each="assignment : ${user.userRoles}" th:if="${assignment.isActive == 1}" th:text="${assignment.role.name}">ADMIN</span></td>
            <td><span class="status" th:classappend="${user.isActive == 1 ? 'status-received' : 'status-cancelled'}" th:text="${user.isActive == 1 ? 'Active' : 'Inactive'}">Active</span></td>
            <td class="text-end text-nowrap"><a th:if="${@permissionService.hasPermission(#authentication,'USERS','EDIT')}" class="btn btn-sm btn-light" th:href="@{/settings/users/{id}/edit(id=${user.id})}"><i class="bi bi-pencil"></i></a>
              <form class="d-inline" th:if="${user.isActive == 1 and @permissionService.hasPermission(#authentication,'USERS','DELETE')}" th:action="@{/settings/users/{id}/deactivate(id=${user.id})}" method="post"><button class="btn btn-sm btn-light text-danger" title="Deactivate"><i class="bi bi-person-x"></i></button></form>
              <form class="d-inline" th:if="${user.isActive == 0 and @permissionService.hasPermission(#authentication,'USERS','EDIT')}" th:action="@{/settings/users/{id}/activate(id=${user.id})}" method="post"><button class="btn btn-sm btn-light text-success" title="Activate"><i class="bi bi-person-check"></i></button></form></td></tr>
          <tr th:if="${users.empty}"><td colspan="5" class="text-center text-secondary py-4">No users found.</td></tr></tbody></table></div>
        <nav th:if="${users.totalPages > 1}" class="mt-4"><ul class="pagination mb-0"><li class="page-item" th:classappend="${users.first ? 'disabled'}"><a class="page-link" th:href="@{/settings/users(search=${search},page=${users.number - 1},size=${users.size})}">Previous</a></li><li class="page-item disabled"><span class="page-link" th:text="|Page ${users.number + 1} of ${users.totalPages}|">Page</span></li><li class="page-item" th:classappend="${users.last ? 'disabled'}"><a class="page-link" th:href="@{/settings/users(search=${search},page=${users.number + 1},size=${users.size})}">Next</a></li></ul></nav>
      </section></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
