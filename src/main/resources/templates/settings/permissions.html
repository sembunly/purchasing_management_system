<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User groups | PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content">
  <header class="topbar"><button class="btn icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button><span class="ms-auto small text-secondary" sec:authentication="name">admin</span><form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Sign out</button></form></header>
  <main class="page">
    <div class="page-head"><div><h1>User groups</h1><p class="text-secondary mb-0">Choose a group to manage its members and permissions.</p></div></div>
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <section class="panel form-panel">
      <div class="panel-head"><h2>Groups</h2><span class="text-secondary small" th:text="|${#lists.size(roles)} groups|">2 groups</span></div>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th scope="col">#</th><th scope="col">Name</th><th scope="col">Active members</th><th scope="col" class="text-end">Action</th></tr></thead>
        <tbody><tr th:each="role, row : ${roles}"><td th:text="${row.count}">1</td><td><span class="fw-semibold" th:text="${role.name}">ADMIN</span></td><td th:text="${memberCounts[role.id]}">1</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/settings/permissions/edit/{id}(id=${role.id})}"><i class="bi bi-pencil-square me-1"></i><span th:text="${@permissionService.hasPermission(#authentication,'PERMISSIONS','EDIT') and @permissionService.hasPermission(#authentication,'USERS','EDIT') ? 'Edit' : 'View'}">Edit</span></a></td></tr>
        <tr th:if="${#lists.isEmpty(roles)}"><td colspan="4" class="text-center text-secondary py-4">No active groups found.</td></tr></tbody>
      </table></div>
    </section>
  </main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
