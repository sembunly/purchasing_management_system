<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="|${pageTitle} - PMS|">User</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><main class="page settings-form-page"><a class="text-decoration-none" th:href="@{/settings/users}"><i class="bi bi-arrow-left"></i> Back to users</a><div class="page-head mt-3"><div><h1 th:text="${pageTitle}">Create user</h1><p class="text-secondary mb-0">Passwords are securely stored with BCrypt.</p></div></div>
  <section class="panel form-panel"><form th:object="${userForm}" method="post" th:action="${isEdit} ? @{/settings/users/{id}(id=${userId})} : @{/settings/users}">
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
    <div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" th:field="*{fullName}"><div class="invalid-feedback d-block" th:errors="*{fullName}"></div></div><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" th:field="*{username}"><div class="invalid-feedback d-block" th:errors="*{username}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" th:field="*{email}" type="email"><div class="invalid-feedback d-block" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Password <small class="text-secondary" th:if="${pageTitle == 'Edit user'}">(leave blank to keep current)</small></label><input class="form-control" th:field="*{password}" type="password" autocomplete="new-password"><div class="invalid-feedback d-block" th:errors="*{password}"></div></div></div>
    <hr class="my-4"><label class="form-label fw-semibold">Roles</label><div class="row g-2"><div class="col-sm-4" th:each="role : ${roles}"><label class="role-choice"><input class="form-check-input me-2" type="checkbox" th:field="*{roleIds}" th:value="${role.id}"><span th:text="${role.name}">ADMIN</span></label></div></div>
    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save user</button><a class="btn btn-light" th:href="@{/settings/users}">Cancel</a></div></form></section></main></body></html>
