<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Products</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${product == null ? 'New product' : 'Edit product'}">Product</h1><p class="text-secondary">JPG or PNG, up to 5 MB.</p></div></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form th:action="${product == null} ? @{/products} : @{/products/{id}(id=${product.id})}" method="post" enctype="multipart/form-data"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="sku">SKU</label><input class="form-control" id="sku" name="sku" maxlength="60" required th:value="${product?.sku}"></div><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="150" required th:value="${product?.name}"></div><div class="col-md-6"><label class="form-label" for="categoryId">Category</label><select class="form-select" id="categoryId" name="categoryId" required><option value="">Choose category</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product != null and product.categoryId == c.id}"></option></select></div><div class="col-md-6"><label class="form-label" for="unit">Unit</label><input class="form-control" id="unit" name="unit" maxlength="30" required th:value="${product == null ? 'PCS' : product.unit}"></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="3" th:text="${product?.description}"></textarea></div><div class="col-12"><label class="form-label" for="image">Product image</label><input class="form-control" id="image" name="image" type="file" accept="image/jpeg,image/png" data-image-input><small class="text-secondary">Leave empty to keep the current image.</small><div class="mt-3"><img class="product-preview" data-image-preview th:src="${product != null and product.imageData != null} ? @{/products/{id}/image(id=${product.id})} : ''" th:style="${product != null and product.imageData != null} ? '' : 'display:none'" alt="Image preview"></div></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save product</button><a class="btn btn-light" th:href="@{/products}">Cancel</a></div></form></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/product-image.js}"></script></body></html>
