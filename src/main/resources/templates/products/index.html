<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Products</strong></header><main class="page"><div class="page-head"><div><h1>Products</h1><p class="text-secondary">Manage product details and images.</p></div><a class="btn btn-primary" th:href="@{/products/new}"><i class="bi bi-plus-lg me-1"></i>New product</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><section class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Image</th><th>SKU</th><th>Name</th><th>Category</th><th>Unit</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${products}"><td><img th:if="${p.hasImage}" class="product-thumb" th:src="@{/products/{id}/image(id=${p.id})}" alt="Product image"><span th:unless="${p.hasImage}" class="product-thumb product-placeholder"><i class="bi bi-image"></i></span></td><td th:text="${p.sku}"></td><td th:text="${p.name}"></td><td th:text="${p.category}"></td><td th:text="${p.unit}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a> <form class="d-inline" th:action="@{/products/{id}/deactivate(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Deactivate this product?')">Deactivate</button></form></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="text-center text-secondary py-4">No products yet.</td></tr></tbody></table></div></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
