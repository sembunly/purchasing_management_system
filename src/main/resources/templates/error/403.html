<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access denied | Purchasing Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><main class="error-page"><section class="error-card shadow-sm text-center" role="alert">
<div class="error-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></div>
<p class="text-primary fw-semibold mb-2">403 · Access denied</p><h1 class="h3 fw-bold">You don't have permission to view this page.</h1>
<p class="text-secondary">You do not have access to this page.</p>
<div class="d-flex justify-content-center gap-2 flex-wrap"><a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
<form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Sign out</button></form></div>
</section></main></body></html>
