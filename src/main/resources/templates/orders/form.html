<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>New order</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1>New purchase order</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="panel" method="post" th:action="@{/orders}"><label class="form-label">Approved request</label><select id="requestId" class="form-select mb-3" name="requestId" required><option value="">Choose request</option><option th:each="r:${requests}" th:value="${r.id}" th:text="|${r.number} · ${r.department}|"></option></select><label class="form-label">Supplier</label><select class="form-select mb-3" name="supplierId" required><option value="">Choose supplier</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select><label>Status</label><select class="form-select mb-3" name="status"><option>DRAFT</option><option>ORDERED</option></select><label>Notes</label><textarea class="form-control mb-3" name="notes" maxlength="500"></textarea><div id="lines"></div><button class="btn btn-primary">Create order</button></form></main></div><script>document.getElementById('requestId').onchange=async e=>{let box=document.getElementById('lines');box.innerHTML='';if(!e.target.value)return;let rows=await(await fetch('/orders/request/'+e.target.value+'/lines')).json();rows.forEach(x=>box.insertAdjacentHTML('beforeend','<div class="row g-2 mb-2"><div class="col-md-5">'+x.product_name+'</div><input type="hidden" name="detailIds" value="'+x.detail_id+'"><div class="col-md-3"><input class="form-control" required name="quantities" type="number" min=".001" max="'+x.quantity+'" step=".001" value="'+x.quantity+'"></div><div class="col-md-3"><input class="form-control" required name="prices" type="number" min="0" step=".01" value="'+x.estimated_unit_price+'"></div></div>'))}</script></body></html>
