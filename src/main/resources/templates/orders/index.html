<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase orders | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Purchase orders</strong></header><main class="page"><div class="page-head"><div><h1>Purchase orders</h1><p class="text-secondary">Generate, view and download PDF reports.</p></div></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><section class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Order</th><th>Supplier</th><th>Date</th><th>Status</th><th>PDF report</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.number}"></td><td th:text="${o.supplier}"></td><td th:text="${o.date}"></td><td th:text="${o.status}"></td><td class="text-nowrap"><form class="d-inline" th:if="${@permissionService.hasPermission(#authentication,'ORDERS','EDIT')}" th:action="@{/orders/{id}/report(id=${o.id})}" method="post"><button class="btn btn-sm btn-primary">Generate</button></form> <span th:if="${o.hasReport}"><a class="btn btn-sm btn-outline-primary" th:href="@{/orders/{id}/report(id=${o.id})}" target="_blank" rel="noopener">View / Print</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/orders/{id}/report(id=${o.id},download=true)}">Download</a></span></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="5" class="text-center text-secondary py-4">No active orders yet.</td></tr></tbody></table></div></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
