<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories | PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content">
  <header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Categories</strong></header>
  <main class="page"><div class="page-head"><div><h1>Categories</h1><p class="text-secondary mb-0">Organize products into categories.</p></div><a class="btn btn-primary" th:href="@{/categories/new}"><i class="bi bi-plus-lg me-1"></i>New category</a></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <section class="panel"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Description</th><th class="text-end">Actions</th></tr></thead><tbody>
      <tr th:each="category : ${categories}"><td class="fw-semibold" th:text="${category.name}">Category</td><td th:text="${category.description ?: '-'}">Description</td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/categories/{id}/edit(id=${category.id})}">Edit</a> <form class="d-inline" th:action="@{/categories/{id}/deactivate(id=${category.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Deactivate this category?')">Deactivate</button></form></td></tr>
      <tr th:if="${#lists.isEmpty(categories)}"><td colspan="3" class="text-center text-secondary py-4">No active categories yet.</td></tr>
    </tbody></table></div></section>
  </main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
