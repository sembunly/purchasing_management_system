<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Record receipt</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1>Record goods receipt</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" class="panel" th:action="@{/receipts}"><label class="form-label">Purchase order</label><select id="orderId" name="orderId" class="form-select mb-3" required><option value="">Choose order</option><option th:each="o:${orders}" th:value="${o.id}" th:text="|${o.number} · ${o.supplier}|"></option></select><div id="lines"></div><label class="form-label">Notes</label><textarea class="form-control mb-3" name="notes" maxlength="500"></textarea><button class="btn btn-primary">Save receipt</button></form></main></div><script>document.getElementById('orderId').onchange=async e=>{const b=document.getElementById('lines');b.innerHTML='';if(!e.target.value)return;const rows=await(await fetch('/receipts/order/'+e.target.value+'/lines')).json();rows.forEach(x=>b.insertAdjacentHTML('beforeend','<div class="row g-2 mb-2"><div class="col-md-5">'+x.product+' <small>(ordered '+x.ordered+', received '+x.received+', remaining '+x.remaining+')</small></div><input type="hidden" name="orderLineIds" value="'+x.line_id+'"><div class="col-md-4"><input class="form-control" required type="number" name="quantities" min="0.001" max="'+x.remaining+'" step="0.001" placeholder="Quantity received"></div></div>'))}</script></body></html>
