<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Goods receipts</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><div class="page-head"><h1>Goods receipts</h1><a class="btn btn-primary" th:href="@{/receipts/new}">Record receipt</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><section class="panel"><table class="table"><thead><tr><th>Receipt</th><th>Order</th><th>Received by</th><th>Date</th><th></th></tr></thead><tbody><tr th:each="r:${receipts}"><td th:text="${r.number}"></td><td th:text="${r.order}"></td><td th:text="${r.receiver}"></td><td th:text="${r.receivedAt}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/receipts/{id}(id=${r.id})}">Details</a></td></tr></tbody></table></section></main></div></body></html>
