<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Receipt details</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1 th:text="${receipt.receipt_no}"></h1><p th:text="|Order ${receipt.order_no} · Received by ${receipt.receiver} · ${receipt.received_at}|"></p><p th:text="${receipt.notes}"></p><section class="panel"><table class="table"><thead><tr><th>Product</th><th>Quantity received</th></tr></thead><tbody><tr th:each="l:${lines}"><td th:text="${l.product}"></td><td th:text="${l.quantity}"></td></tr></tbody></table></section><a class="btn btn-light" th:href="@{/receipts}">Back</a></main></div></body></html>
