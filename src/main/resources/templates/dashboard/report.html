<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|${title} - Purchasing Management|">Report</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button><strong th:text="${title}">Report</strong><span class="ms-auto" sec:authentication="name">User</span></header><main class="page"><div class="page-head"><div><h1 th:text="${title}">Report</h1><p class="text-secondary">Filtered records and summary totals.</p></div><button type="button" class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button></div><section class="panel mb-3"><form class="row g-2"><div class="col-auto"><label class="form-label">From</label><input type="date" name="from" class="form-control" th:value="${from}"></div><div class="col-auto"><label class="form-label">To</label><input type="date" name="to" class="form-control" th:value="${to}"></div><div class="col-auto"><label class="form-label">Status</label><select name="status" class="form-select"><option value="">All statuses</option><option>DRAFT</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>ORDERED</option><option>PARTIAL</option><option>RECEIVED</option><option>CANCELLED</option><option>PAID</option></select></div><div class="col-auto align-self-end"><button class="btn btn-primary">Filter</button></div></form></section><div class="panel mb-3"><strong>Summary total: </strong><span th:text="${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}"></span></div><section class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Reference</th><th>Department / order</th><th>Date</th><th>Status</th><th class="text-end" th:text="${amountLabel}">Amount</th></tr></thead><tbody><tr th:each="row : ${rows}"><td class="fw-semibold" th:text="${row.reference}"></td><td th:text="${row.detail}"></td><td th:text="${row.date == null ? '-' : #temporals.format(row.date,'dd MMM yyyy HH:mm')}"></td><td><span class="status" th:text="${row.status}"></span></td><td class="text-end" th:text="${#numbers.formatDecimal(row.amount,1,'COMMA',2,'POINT')}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="text-center text-secondary py-4">No records found.</td></tr></tbody></table></div></section></main></div></div><style>@media print{.sidebar,.topbar,form,button{display:none!important}.page{padding:0}.panel{border:0}}</style><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
