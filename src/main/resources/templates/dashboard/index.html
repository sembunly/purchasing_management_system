<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Purchasing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<header class="navbar navbar-dark bg-primary shadow-sm"><div class="container">
    <span class="navbar-brand mb-0 h1">Purchasing Management System</span>
    <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Sign out</button></form>
</div></header>
<main class="container py-5"><div class="bg-white rounded-4 shadow-sm p-4 p-md-5">
    <p class="text-primary fw-semibold mb-2">DASHBOARD</p>
    <h1 class="display-6 fw-bold">Welcome, <span sec:authentication="name">User</span></h1>
    <p class="text-secondary mb-0">You have signed in successfully. Your purchasing overview will appear here.</p>
</div></main>
</body>
</html>
