<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Suppliers</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${supplier.id == null ? 'New supplier' : 'Edit supplier'}">Supplier</h1><p class="text-secondary mb-0">Supplier contact information.</p></div></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form th:action="${supplier.id == null} ? @{/suppliers} : @{/suppliers/{id}(id=${supplier.id})}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Supplier name</label><input class="form-control" id="name" name="name" maxlength="150" required th:value="${supplier.name}"></div><div class="col-md-6"><label class="form-label" for="contactName">Contact name</label><input class="form-control" id="contactName" name="contactName" maxlength="120" th:value="${supplier.contactName}"></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" maxlength="40" th:value="${supplier.phone}"></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="150" th:value="${supplier.email}"></div><div class="col-12"><label class="form-label" for="address">Address</label><textarea class="form-control" id="address" name="address" maxlength="500" rows="3" th:text="${supplier.address}"></textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save supplier</button><a class="btn btn-light" th:href="@{/suppliers}">Cancel</a></div></form></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
