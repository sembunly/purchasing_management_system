<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier details | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Suppliers</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${supplier.name}">Supplier name</h1><p class="text-secondary mb-0">Supplier details</p></div><div class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">Edit</a><a class="btn btn-light" th:href="@{/suppliers}">Back</a></div></div><section class="panel"><dl class="row mb-0"><dt class="col-sm-3 py-2">Contact name</dt><dd class="col-sm-9 py-2" th:text="${supplier.contactName ?: '-'}"></dd><dt class="col-sm-3 py-2">Phone</dt><dd class="col-sm-9 py-2" th:text="${supplier.phone ?: '-'}"></dd><dt class="col-sm-3 py-2">Email</dt><dd class="col-sm-9 py-2" th:text="${supplier.email ?: '-'}"></dd><dt class="col-sm-3 py-2">Address</dt><dd class="col-sm-9 py-2 text-break" th:text="${supplier.address ?: '-'}"></dd></dl></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
