<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Suppliers</strong></header><main class="page"><div class="page-head"><div><h1>Suppliers</h1><p class="text-secondary mb-0">Manage supplier contacts and addresses.</p></div><a class="btn btn-primary" th:href="@{/suppliers/new}"><i class="bi bi-plus-lg me-1"></i>New supplier</a></div>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div><section class="panel"><form class="row g-2 mb-3" method="get"><div class="col-sm-8 col-md-5"><input class="form-control" name="search" th:value="${search}" placeholder="Search supplier name" aria-label="Search supplier name"></div><div class="col-auto"><button class="btn btn-outline-secondary"><i class="bi bi-search me-1"></i>Search</button></div><div class="col-auto"><a class="btn btn-light" th:href="@{/suppliers}">Clear</a></div></form>
<div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Email</th><th class="text-end">Actions</th></tr></thead><tbody><tr th:each="supplier : ${suppliers}"><td class="fw-semibold" th:text="${supplier.name}"></td><td th:text="${supplier.contactName ?: '-'}"></td><td th:text="${supplier.phone ?: '-'}"></td><td th:text="${supplier.email ?: '-'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/suppliers/{id}(id=${supplier.id})}">Details</a> <a class="btn btn-sm btn-outline-primary" th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/suppliers/{id}/deactivate(id=${supplier.id})}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Deactivate this supplier?')">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="5" class="text-center text-secondary py-4">No suppliers found.</td></tr></tbody></table></div></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
