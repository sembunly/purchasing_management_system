<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">PM</span> Purchasing</div>
    <nav class="side-nav" aria-label="Main navigation">
        <a th:href="@{/dashboard}" th:classappend="${activeCode == 'DASHBOARD' ? 'active' : ''}"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
        <div class="side-group">Purchasing</div>
        <a th:href="@{/orders}" th:classappend="${activeCode == 'ORDERS' ? 'active' : ''}"><i class="bi bi-bag-check"></i><span>Purchase orders</span></a>
        <div class="side-group">Master Data</div>
        <a th:href="@{/products}" th:classappend="${activeCode == 'PRODUCTS' ? 'active' : ''}"><i class="bi bi-tags"></i><span>Products</span></a>
        <div class="side-group">Reports</div>
        <a th:href="@{/reports/purchasing}" th:classappend="${activeCode == 'PURCHASING_REPORT' ? 'active' : ''}"><i class="bi bi-bar-chart"></i><span>Purchasing report</span></a>
        <a th:href="@{/reports/receiving}" th:classappend="${activeCode == 'RECEIVING_REPORT' ? 'active' : ''}"><i class="bi bi-bar-chart"></i><span>Receiving report</span></a>
        <a th:href="@{/reports/payments}" th:classappend="${activeCode == 'PAYMENT_REPORT' ? 'active' : ''}"><i class="bi bi-bar-chart"></i><span>Payment report</span></a>
        <div class="side-group">Settings</div>
        <a th:href="@{/settings/users}" th:classappend="${activeCode == 'USERS' ? 'active' : ''}"><i class="bi bi-people"></i><span>Users</span></a>
    </nav>
</aside>
</body>
</html>
