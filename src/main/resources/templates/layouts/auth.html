<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, heading, subtitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | Purchasing Management System'}">Purchasing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="row g-0 min-vh-100">

    <!-- Left: purchasing flow -->
    <aside class="col-lg-6 d-none d-lg-flex login-story">
        <div class="brand"><span class="brand-mark" aria-hidden="true">PM</span> Purchasing</div>
        <div>
            <h2 class="story-title">Every purchase, from request to payment</h2>
            <ol class="flow">
                <li><strong>Request</strong><span>Departments ask for what they need</span></li>
                <li><strong>Order</strong><span>Managers approve and order from a supplier</span></li>
                <li><strong>Receipt</strong><span>Staff confirm what arrived</span></li>
                <li><strong>Payment</strong><span>Finance pays by cash, bank or KHQR</span></li>
            </ol>
        </div>
        <small class="story-foot">Purchasing Management System</small>
    </aside>

    <!-- Right: form -->
    <section class="col-12 col-lg-6 d-flex align-items-center justify-content-center login-panel">
        <div class="login-box">
            <div class="brand-mark d-lg-none mb-4" aria-hidden="true">PM</div>
            <h1 class="h3 fw-bold mb-1" th:text="${heading}">Heading</h1>
            <p class="text-secondary mb-4" th:text="${subtitle}">Subtitle</p>
            <th:block th:replace="${content}"></th:block>
        </div>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
