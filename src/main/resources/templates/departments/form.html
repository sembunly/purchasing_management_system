<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Department | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Departments</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${department == null ? 'New department' : 'Edit department'}">Department</h1><p class="text-secondary mb-0">Department name and description.</p></div></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form th:action="${department == null or department.id == null} ? @{/departments} : @{/departments/{id}(id=${department.id})}" method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="120" required th:value="${department?.name}"></div><div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="4" th:text="${department?.description}"></textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save department</button><a class="btn btn-light" th:href="@{/departments}">Cancel</a></div></form></section></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
