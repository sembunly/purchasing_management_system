<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout('Sign in', 'Sign in', 'Use your work account to continue.', ~{::content})}">
<head>
    <title>Sign in | Purchasing Management System</title>
</head>
<body>
<th:block th:fragment="content">
    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Invalid username or password, or your account is inactive.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        You have signed out successfully.
    </div>
    <div th:if="${param.registered}" class="alert alert-success" role="alert">
        Account created<span th:if="${registeredUsername}"> for <strong th:text="${registeredUsername}"></strong></span>.
        Sign in to continue.
    </div>

    <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input id="username" name="username" type="text" class="form-control form-control-lg"
                   autocomplete="username" required autofocus>
            <div class="invalid-feedback">Enter your username.</div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <input id="password" name="password" type="password" class="form-control form-control-lg"
                       autocomplete="current-password" required>
                <button class="btn btn-outline-secondary password-toggle" type="button"
                        aria-label="Show password" aria-controls="password" data-password-toggle>
                    <i class="bi bi-eye" aria-hidden="true" data-password-icon></i>
                </button>
                <div class="invalid-feedback">Enter your password.</div>
            </div>
        </div>

        <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
    </form>

    <p class="small text-secondary mt-4 mb-0">New here? <a th:href="@{/signup}">Create an account</a></p>
    <p class="small text-secondary mt-2 mb-0">Secure access for authorized team members.</p>
</th:block>
</body>
</html>
