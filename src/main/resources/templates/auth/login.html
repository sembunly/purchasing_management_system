<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Purchasing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="container py-4 py-md-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <section class="login-card shadow-lg">
                <div class="brand-mark" aria-hidden="true">PM</div>
                <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                <p class="text-secondary mb-4">Sign in to Purchasing Management System</p>

                <div th:if="${param.error}" class="alert alert-danger d-flex gap-2" role="alert">
                    <span aria-hidden="true">!</span><span>Invalid username or password, or your account is inactive.</span>
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">You have signed out successfully.</div>

                <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input id="username" name="username" type="text" class="form-control form-control-lg"
                               autocomplete="username" required autofocus>
                        <div class="invalid-feedback">Please enter your username.</div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <input id="password" name="password" type="password" class="form-control form-control-lg"
                                   autocomplete="current-password" required>
                            <button class="btn btn-outline-secondary password-toggle" type="button"
                                    aria-label="Show password" aria-controls="password" data-password-toggle>
                                <span data-password-label>Show</span>
                            </button>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
                </form>
                <p class="small text-center text-secondary mt-4 mb-0">Secure access for authorized team members</p>
            </section>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
