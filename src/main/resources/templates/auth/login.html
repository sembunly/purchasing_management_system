<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-panel min-vh-100 d-flex align-items-center justify-content-center">
    <section class="login-box">
        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="brand-mark" aria-hidden="true">PM</span>
            <span class="fw-semibold">Purchasing</span>
        </div>
        <h1 class="h3 fw-bold mb-4">Sign in</h1>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" type="text" class="form-control"
                       autocomplete="username" required autofocus>
                <div class="invalid-feedback">Enter your username.</div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input id="password" name="password" type="password" class="form-control"
                           autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary password-toggle" type="button"
                            aria-label="Show password" aria-controls="password" data-password-toggle>
                        <i class="bi bi-eye" aria-hidden="true" data-password-icon></i>
                    </button>
                    <div class="invalid-feedback">Enter your password.</div>
                </div>
            </div>

            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
