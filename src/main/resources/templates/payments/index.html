<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><div class="page-head"><h1>Payments</h1><a class="btn btn-primary" th:href="@{/payments/new}">Record payment</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><section class="panel"><table class="table"><thead><tr><th>Payment</th><th>Order</th><th>Method</th><th>Amount</th><th>Date</th><th>Reference</th><th></th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.PAYMENT_NO}"></td><td th:text="${p.ORDER_NO}"></td><td th:text="${p.METHOD}"></td><td th:text="${p.AMOUNT}"></td><td th:text="${p.PAYMENT_DATE}"></td><td th:text="${p.REFERENCE_NO ?: '-'}"></td><td><a th:href="@{/payments/order/{id}(id=${p.PURCHASE_ORDER_ID})}">Order history</a></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="7" class="text-center">No payments recorded.</td></tr></tbody></table></section></main></div></body></html>
