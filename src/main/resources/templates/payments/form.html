<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Record payment</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1>Record payment</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form method="post" th:action="@{/payments}"><label class="form-label">Purchase order</label><select name="orderId" id="orderId" class="form-select mb-3" required><option value="">Select order</option><option th:each="o:${orders}" th:value="${o.id}" th:attr="data-total=${o.total},data-paid=${o.paid},data-balance=${o.remaining}" th:text="|${o.number} · ${o.supplier} (remaining ${o.remaining})|"></option></select><div id="balance" class="alert alert-info" hidden></div><label class="form-label">Payment method</label><select class="form-select mb-3" name="methodId" required><option value="">Choose method</option><option th:each="m:${methods}" th:value="${m.id}" th:text="${m.name}"></option></select><label class="form-label">Amount</label><input id="amount" class="form-control mb-3" name="amount" type="number" min="0.01" step="0.01" required><label class="form-label">Reference</label><input class="form-control mb-3" name="referenceNo" maxlength="100"><label class="form-label">Notes</label><textarea class="form-control mb-3" name="notes" maxlength="500"></textarea><button class="btn btn-primary">Save payment</button></form></section></main></div><script>const order=document.getElementById('orderId'),amount=document.getElementById('amount'),balance=document.getElementById('balance');order.onchange=()=>{let b=order.selectedOptions[0].dataset.balance;balance.hidden=!b;balance.textContent=b?'Remaining balance: '+b:'';amount.max=b||''}</script></body></html>
