<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payment history</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1 th:text="|Payment history: ${order.ORDER_NO}|"></h1><p th:text="|Order total: ${total} · Paid: ${paid} · Remaining: ${remaining}|"></p><section class="panel"><table class="table"><thead><tr><th>Payment</th><th>Method</th><th>Amount</th><th>Date</th><th>Reference</th><th>Notes</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.PAYMENT_NO}"></td><td th:text="${p.METHOD}"></td><td th:text="${p.AMOUNT}"></td><td th:text="${p.PAYMENT_DATE}"></td><td th:text="${p.REFERENCE_NO}"></td><td th:text="${p.NOTES}"></td></tr></tbody></table></section></main></div></body></html>
