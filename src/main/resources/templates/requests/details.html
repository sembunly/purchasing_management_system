<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request details | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><strong>Purchase requests</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${request.number}"></h1><p class="text-secondary" th:text="|${request.department} · ${request.status} · ${request.requestedBy}|"></p></div><a class="btn btn-primary" th:if="${request.status == 'DRAFT' or request.status == 'PENDING'}" th:href="@{/requests/{id}/edit(id=${request.id})}">Edit</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><p th:text="${request.notes ?: 'No notes'}"></p><section class="panel"><table class="table"><thead><tr><th>Product</th><th>Quantity</th><th>Estimated unit price</th></tr></thead><tbody><tr th:each="line:${lines}"><td th:text="${line.product}"></td><td th:text="${line.quantity}"></td><td th:text="${line.price}"></td></tr></tbody></table></section><section class="panel mt-3" th:if="${request.status == 'PENDING'}" sec:authorize="hasAnyRole('ADMIN','MANAGER')"><h2 class="h5 mb-3">Approval decision</h2><div class="d-flex flex-wrap gap-2 align-items-start"><form method="post" th:action="@{/requests/{id}/approve(id=${request.id})}"><button class="btn btn-success" onclick="return confirm('Approve this purchase request?')"><i class="bi bi-check-lg me-1"></i>Approve</button></form><details><summary class="btn btn-outline-danger">Reject</summary><form class="mt-3" method="post" th:action="@{/requests/{id}/reject(id=${request.id})}"><label class="form-label" for="reason">Rejection reason</label><textarea class="form-control mb-2" id="reason" name="reason" required maxlength="500" rows="3" placeholder="Explain why this request is rejected"></textarea><button class="btn btn-danger">Confirm rejection</button></form></details></div></section><a class="btn btn-light mt-3" th:href="@{/requests}">Back</a></main></div></div></body></html>
