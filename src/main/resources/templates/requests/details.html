<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request details | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><strong>Purchase requests</strong></header><main class="page"><div class="page-head"><div><h1 th:text="${request.number}"></h1><p class="text-secondary" th:text="|${request.department} · ${request.status} · ${request.requestedBy}|"></p></div><a class="btn btn-primary" th:if="${request.status == 'DRAFT' or request.status == 'PENDING'}" th:href="@{/requests/{id}/edit(id=${request.id})}">Edit</a></div><p th:text="${request.notes ?: 'No notes'}"></p><section class="panel"><table class="table"><thead><tr><th>Product</th><th>Quantity</th><th>Estimated unit price</th></tr></thead><tbody><tr th:each="line:${lines}"><td th:text="${line.product}"></td><td th:text="${line.quantity}"></td><td th:text="${line.price}"></td></tr></tbody></table></section><a class="btn btn-light mt-3" th:href="@{/requests}">Back</a></main></div></div></body></html>
