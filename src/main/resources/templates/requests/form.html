<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase request | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><strong>Purchase requests</strong></header><main class="page"><h1 th:text="${request == null or request.id == null ? 'New purchase request' : 'Edit purchase request'}"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form th:action="${request == null or request.id == null} ? @{/requests} : @{/requests/{id}(id=${request.id})}" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="departmentId" required><option value="">Choose</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${request != null and request.departmentId == d.id}"></option></select></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option value="DRAFT" th:selected="${request == null or request.status == 'DRAFT'}">DRAFT</option><option value="PENDING" th:selected="${request != null and request.status == 'PENDING'}">PENDING</option></select></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" maxlength="500" th:text="${request?.notes}"></textarea></div></div><h2 class="h5 mt-4">Product lines</h2><div id="lines"><div class="row g-2 mb-2 line" th:each="line : ${lines}"><div class="col-md-6"><select name="productIds" class="form-select" required><option th:each="p:${products}" th:value="${p.id}" th:text="|${p.sku} — ${p.name}|" th:selected="${p.id == line.productId}"></option></select></div><div class="col-md-2"><input class="form-control" name="quantities" type="number" min="0.001" step="0.001" required th:value="${line.quantity}" placeholder="Quantity"></div><div class="col-md-2"><input class="form-control" name="prices" type="number" min="0" step="0.01" required th:value="${line.price}" placeholder="Unit price"></div><div class="col-md-2"><button type="button" class="btn btn-outline-danger remove">Remove</button></div></div><div class="row g-2 mb-2 line" th:if="${#lists.isEmpty(lines)}"><div class="col-md-6"><select name="productIds" class="form-select" required><option value="">Choose product</option><option th:each="p:${products}" th:value="${p.id}" th:text="|${p.sku} — ${p.name}|"></option></select></div><div class="col-md-2"><input class="form-control" name="quantities" type="number" min="0.001" step="0.001" required placeholder="Quantity"></div><div class="col-md-2"><input class="form-control" name="prices" type="number" min="0" step="0.01" required placeholder="Est. unit price"></div><div class="col-md-2"><button type="button" class="btn btn-outline-danger remove">Remove</button></div></div></div><button type="button" id="add" class="btn btn-outline-secondary mt-2">Add product</button><div class="mt-4"><button class="btn btn-primary">Save request</button> <a class="btn btn-light" th:href="@{/requests}">Cancel</a></div></form></section></main></div></div><script th:inline="javascript">const products=/*[[${products}]]*/[];document.getElementById('add').onclick=()=>{const r=document.createElement('div');r.className='row g-2 mb-2 line';r.innerHTML='<div class="col-md-6"><select required name="productIds" class="form-select"><option value="">Choose product</option>'+products.map(p=>'<option value="'+p.id+'">'+p.sku+' — '+p.name+'</option>').join('')+'</select></div><div class="col-md-2"><input required class="form-control" name="quantities" type="number" min="0.001" step="0.001" placeholder="Quantity"></div><div class="col-md-2"><input required class="form-control" name="prices" type="number" min="0" step="0.01" placeholder="Est. unit price"></div><div class="col-md-2"><button type="button" class="btn btn-outline-danger remove">Remove</button></div>';document.getElementById('lines').append(r)};document.addEventListener('click',e=>{if(e.target.matches('.remove')){const rows=document.querySelectorAll('.line');if(rows.length>1)e.target.closest('.line').remove()}});</script></body></html>
