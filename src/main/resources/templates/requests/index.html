<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase requests | PMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><div class="content"><header class="topbar"><button class="btn icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list"></i></button><strong>Purchase requests</strong></header><main class="page"><div class="page-head"><div><h1>Purchase requests</h1><p class="text-secondary mb-0">Draft and submit purchasing needs.</p></div><a class="btn btn-primary" th:href="@{/requests/new}">New request</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel"><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="search" th:value="${search}" placeholder="Search request number"></div><div class="col-auto"><button class="btn btn-outline-secondary">Search</button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Request</th><th>Department</th><th>Requested by</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="r : ${requests}"><td th:text="${r.number}"></td><td th:text="${r.department}"></td><td th:text="${r.requestedBy}"></td><td><span class="status" th:text="${r.status}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/requests/{id}(id=${r.id})}">Details</a><a class="btn btn-sm btn-outline-primary" th:if="${r.status == 'DRAFT' or r.status == 'PENDING'}" th:href="@{/requests/{id}/edit(id=${r.id})}">Edit</a><form class="d-inline" th:if="${r.status == 'DRAFT' or r.status == 'PENDING'}" method="post" th:action="@{/requests/{id}/deactivate(id=${r.id})}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(requests)}"><td colspan="5" class="text-center text-secondary">No requests found.</td></tr></tbody></table></div></section></main></div></div></body></html>
