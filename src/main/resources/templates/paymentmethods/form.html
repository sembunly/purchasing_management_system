<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payment method</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><h1 th:text="${method == null ? 'New payment method' : 'Edit payment method'}"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel form-panel"><form method="post" th:action="${method == null} ? @{/payment-methods} : @{/payment-methods/{id}(id=${method.id})}"><label class="form-label" for="code">Code</label><input class="form-control mb-3" id="code" name="code" maxlength="40" required placeholder="CASH, BANK, KHQR" th:value="${method?.code}"><label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" maxlength="100" required placeholder="Cash, Bank Transfer, KHQR" th:value="${method?.name}"><button class="btn btn-primary">Save method</button> <a class="btn btn-light" th:href="@{/payment-methods}">Cancel</a></form></section></main></div></body></html>
