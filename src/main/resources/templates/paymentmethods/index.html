<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payment methods</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app"><div class="shell"><aside th:replace="~{layouts/navigation :: sidebar}"></aside><main class="page"><div class="page-head"><h1>Payment methods</h1><a class="btn btn-primary" th:href="@{/payment-methods/new}">New method</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><section class="panel"><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Actions</th></tr></thead><tbody><tr th:each="m:${methods}"><td th:text="${m.code}"></td><td th:text="${m.name}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/payment-methods/{id}/edit(id=${m.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/payment-methods/{id}/deactivate(id=${m.id})}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(methods)}"><td colspan="3" class="text-center">No methods yet.</td></tr></tbody></table></section></main></div></body></html>
